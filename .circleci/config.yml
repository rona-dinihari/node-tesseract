# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
jobs:
  test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: "Install tesseract OCR."
          context: dawnsparks-node-tesseract
          command: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run:
          name: "Install dependencies, and run tests."
          context: dawnsparks-node-tesseract
          command: |
            npm ci
            npm test
            exit 0
      - store_test_results:
          path: test-results
  deploy:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: "Install dependencies & publish to npmjs.com."
          context: dawnsparks-node-tesseract
          command: |
            npm ci
            npm publish
            exit 0
  on_success:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: "Update a deploy to SUCCESS"
          context: dawnsparks-node-tesseract
          command: |
            circleci run release update \
              --status=SUCCESS
          when: on_success
  on_fail:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: "Update planned deploy to FAILED"
          context: dawnsparks-node-tesseract
          command: |
            circleci run release update \
              --status=FAILED
          when: on_fail

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/workflows/ & https://circleci.com/docs/configuration-reference/#workflows
workflows:
  test-workflow:
    jobs:
      - test
  deployment-workflow:
    jobs:
      - deploy:
          filters:
            branches:
              only: main
            tags:
              only: /^v.*/
      - on_success:
          requires: [deploy]
      - on_fail:
          requires: [deploy]
