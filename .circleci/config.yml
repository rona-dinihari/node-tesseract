# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

orbs:
  sonarcloud: sonarsource/sonarcloud@4.0.0

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
jobs:
  test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: "Install tesseract OCR."
          command: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run:
          name: "Install dependencies, and run tests."
          command: |
            npm ci
            npm run prepack
            npm test
            exit 0
      - sonarcloud/scan
      - store_test_results:
          path: test-results
  mark:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: Plan a publish
          command: |
            echo "Planning a publish for version $CIRCLE_TAG to npmjs.com."
            circleci run release plan npmjs \
              --environment-name="dawnsparks-node-tesseract" \
              --target-version=$CIRCLE_TAG
            exit 0
  publish:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: "Install dependencies & publish to npmjs.com."
          command: |
            npm ci
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
            npm publish --access=public

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/workflows/ & https://circleci.com/docs/configuration-reference/#workflows
workflows:
  test-workflow:
    jobs:
      - test:
          context: sonarcloud
          filters:
            branches:
              only: development
            tags:
              ignore: /v[0-9]+(\.[0-9]+)*/
  mark-workflow:
    jobs:
      - mark:
          context: dawnsparks-node-tesseract
          filters:
            branches:
              only: main
            tags:
              only: /.*/
  publish-workflow:
    jobs:
      - publish:
          context: dawnsparks-node-tesseract
          filters:
            branches:
              only: main
            tags:
              only: /v[0-9]+(\.[0-9]+)*/
