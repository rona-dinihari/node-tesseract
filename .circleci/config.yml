# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
jobs:
  test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: "Install tesseract OCR."
          context: dawnsparks-node-tesseract
          command: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run:
          name: "Install dependencies, and run tests."
          context: dawnsparks-node-tesseract
          command: |
            npm ci
            npm test
            exit 0
      - store_test_results:
          path: test-results
  mark:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: Plan a publish
          context: dawnsparks-node-tesseract
          command: |
            echo "Planning a publish for version $(echo $pipeline.git.tag) to npmjs.com."
            circleci run release plan npmjs \
              --environment-name="huedawn-node-tesseract" \
              --target-version=$(echo $pipeline.git.tag)
            exit 0
  publish:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: "Install dependencies & publish to npmjs.com."
          context: dawnsparks-node-tesseract
          command: |
            npm ci
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
            npm publish
  on_success:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: "Update a publish to SUCCESS"
          context: dawnsparks-node-tesseract
          command: |
            circleci run release update npmjs --status=SUCCESS
          when: on_success
  on_fail:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: "Update planned publish to FAILED"
          context: dawnsparks-node-tesseract
          command: |
            circleci run release update npmjs --status=FAILED
          when: on_fail

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/workflows/ & https://circleci.com/docs/configuration-reference/#workflows
workflows:
  test-workflow:
    jobs:
      - test
  mark-workflow:
    jobs:
      - mark:
          filters:
            branches:
              only: development
            tags:
              only: /v[0-9]+(\.[0-9]+)*/
  publish-workflow:
    jobs:
      - publish:
          filters:
            branches:
              only: main
            tags:
              only: /v[0-9]+(\.[0-9]+)*/
      - on_success:
          requires: [publish]
      - on_fail:
          requires: [publish]
