# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
jobs:
  build_and_test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: "Install dependencies, and run tests."
          context: dawnsparks-node-tesseract
          command: |
            # touch ~/.npmrc
            # echo "//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN" >> ~/.npmrc
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
            npm ci
            npm test
  deploy:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: "Install dependencies & publish to npmjs.com."
          context: dawnsparks-node-tesseract
          command: npm ci && npm publish
  on_success:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: "Update a deploy to SUCCESS"
          command: circleci run release update --status=SUCCESS
          when: on_success
  on_fail:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: "Update planned deploy to FAILED"
          command: circleci run release update --status=FAILED
          when: on_fail

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/workflows/ & https://circleci.com/docs/configuration-reference/#workflows
workflows:
  test-workflow:
    jobs:
      - build_and_test:
          context: dawnsparks-node-tesseract # Ensure context includes release logic
      - on_success:
          requires: [build_and_test]
      - on_fail:
          requires: [build_and_test]
  deployment-workflow:
    when: pipeline.git.branch == "main"
    jobs:
      - deploy:
          context: dawnsparks-node-tesseract # Ensure context includes release logic
      - on_success:
          requires: [deploy]
      - on_fail:
          requires: [deploy]
