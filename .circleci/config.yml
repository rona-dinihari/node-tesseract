# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
jobs:
  deploy-app:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: "Install, test, and deploy."
          command: |
            sudo apt-get update && sudo apt-get upgrade -y && sudo apt-get install -y apt-transport-https
            echo "deb https://notesalexp.org/tesseract-ocr5/$(lsb_release -cs)/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/notesalexp.list > /dev/null
            wget -O - https://notesalexp.org/debian/alexp_key.asc | sudo apt-key add -
            sudo apt-get update && sudo apt-get install -y tesseract-ocr
            # touch ~/.npmrc
            # echo "//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN" >> ~/.npmrc
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
            npm ci
            npm test
            npm publish

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/workflows/ & https://circleci.com/docs/configuration-reference/#workflows
workflows:
  deploy-app-workflow:
    jobs:
      - deploy-app:
          context: dawnsparks-node-tesseract
