# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
jobs:
  build:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: "Install tesseract OCR."
          command: |
            sudo apt-get update && sudo apt-get upgrade -y && sudo apt-get install -y apt-transport-https
            echo "deb https://notesalexp.org/tesseract-ocr5/$(lsb_release -cs)/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/notesalexp.list > /dev/null
            wget -O - https://notesalexp.org/debian/alexp_key.asc | sudo apt-key add -
            sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run:
          name: "Install dependencies, and run tests."
          context: dawnsparks-node-tesseract
          command: npm ci && npm test
  test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: "Install dependencies, and run tests."
          context: dawnsparks-node-tesseract
          command: npm ci && npm test
      - store_test_results:
          path: test-results
  deploy:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: "Install dependencies & publish to npmjs.com."
          context: dawnsparks-node-tesseract
          command: npm ci && npm publish
  on_success:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: "Update a deploy to SUCCESS"
          command: circleci run release update --status=SUCCESS
          when: on_success
  on_fail:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: "Update planned deploy to FAILED"
          command: circleci run release update --status=FAILED
          when: on_fail

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/workflows/ & https://circleci.com/docs/configuration-reference/#workflows
workflows:
  test-workflow:
    jobs:
      - build
      - test:
          requires: [build]
      - on_success:
          requires: [build, test]
      - on_fail:
          requires: [build, test]
  deployment-workflow:
    jobs:
      - build
      - deploy:
          requires: [build]
          filters:
            branches:
              only: main
            tags:
              only: /^v.*/
      - on_success:
          requires: [build, deploy]
      - on_fail:
          requires: [build, deploy]
